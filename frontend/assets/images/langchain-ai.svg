<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e3d59" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#845EC2" />
    </linearGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#aiGrad)" />
  <rect width="600" height="400" rx="16" fill="url(#dotPattern)" />

  <!-- LangChain RAG & Agent Flow -->
  <g transform="translate(40, 70)">
    <!-- Document/Prompt Ingestion -->
    <rect x="10" y="70" width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="100" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">User Prompt</text>
    <text x="60" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">&amp; Queries</text>

    <!-- Connector Arrow -->
    <path d="M 110 105 L 155 105" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="160,105 152,100 152,110" fill="#38bdf8"/>

    <!-- LangChain Orchestrator Box -->
    <rect x="160" y="40" width="190" height="130" rx="12" fill="rgba(23,162,184,0.12)" stroke="#17a2b8" stroke-width="2"/>
    <rect x="180" y="55" width="150" height="26" rx="6" fill="#1e3d59"/>
    <text x="255" y="73" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🦜 LangChain Pipeline</text>
    
    <rect x="180" y="90" width="150" height="28" rx="6" fill="#1e293b" stroke="#00C9A7" stroke-width="1"/>
    <text x="255" y="108" fill="#00C9A7" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">RAG &amp; Vector Store</text>

    <rect x="180" y="128" width="150" height="28" rx="6" fill="#1e293b" stroke="#845EC2" stroke-width="1"/>
    <text x="255" y="146" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Chains &amp; Prompts</text>

    <!-- Connector to LLM -->
    <path d="M 350 105 L 395 105" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="400,105 392,100 392,110" fill="#38bdf8"/>

    <!-- Large Language Model Box -->
    <rect x="400" y="60" width="115" height="90" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="457" y="98" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LLM Engine</text>
    <text x="457" y="118" fill="#c084fc" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Generative Output</text>
    
    <!-- Bottom feature pills -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="145" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="#334155" stroke-width="1"/>
      <text x="72" y="22" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Context Augmentation</text>

      <rect x="165" y="0" width="145" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="#334155" stroke-width="1"/>
      <text x="237" y="22" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Semantic Search</text>

      <rect x="330" y="0" width="145" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="#334155" stroke-width="1"/>
      <text x="402" y="22" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Agentic Execution</text>
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="30" y="28" width="260" height="28" rx="6" fill="rgba(0,201,167,0.15)" stroke="#00C9A7" stroke-width="1"/>
  <text x="160" y="47" fill="#00C9A7" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">LANGCHAIN &amp; GENERATIVE AI</text>
</svg>
